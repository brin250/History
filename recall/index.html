<title>H2 History Case Drill</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: an exam script. Ruled answer sheet in the centre, examiner's red pen for marking, ink-blue for the candidate. */
:root{
  --paper:#f6f7f9; --sheet:#ffffff; --rule:#dfe4ec; --ink:#1b2333; --muted:#5d6779;
  --blue:#1f45a8; --blue-soft:#e6ecfa; --red:#c2262e; --red-soft:#fbe9ea;
  --ok:#1f7a4d; --ok-soft:#e3f3ea; --warn:#9a6400; --warn-soft:#fbf0d9;
  --display:"Spectral",Georgia,"Times New Roman",serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11151d; --sheet:#181d27; --rule:#2a3140; --ink:#e4e8f0; --muted:#98a2b5;
  --blue:#8fb0ff; --blue-soft:#1d2a4a; --red:#ff7b80; --red-soft:#3a1f24;
  --ok:#6fd3a0; --ok-soft:#163327; --warn:#f0c065; --warn-soft:#3a2e15; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151d; --sheet:#181d27; --rule:#2a3140; --ink:#e4e8f0; --muted:#98a2b5;
  --blue:#8fb0ff; --blue-soft:#1d2a4a; --red:#ff7b80; --red-soft:#3a1f24;
  --ok:#6fd3a0; --ok-soft:#163327; --warn:#f0c065; --warn-soft:#3a2e15; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.eyebrow{font:600 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;border-bottom:1px solid var(--rule);padding-bottom:14px}
header.top h1{font-size:clamp(26px,4vw,34px);font-weight:700;letter-spacing:-.01em}
header.top p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.sync{font:12px var(--mono);color:var(--muted)}
nav.tabs{display:flex;gap:4px;background:var(--sheet);border:1px solid var(--rule);border-radius:999px;padding:3px}
nav.tabs button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500}
nav.tabs button[aria-selected="true"]{background:var(--blue);color:var(--sheet)}

.grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px;display:grid;gap:14px;min-width:0}
.panel h2{font-size:18px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.seg button{border:1px solid var(--rule);background:var(--paper);border-radius:var(--r);padding:8px 4px;cursor:pointer;font-size:13px;line-height:1.25}
.seg button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);font-weight:600}
.seg small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.paperset{display:grid;gap:6px}
.paperset .ph{display:flex;justify-content:space-between;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.chip .n{font:11px var(--mono);color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--blue);cursor:pointer;font-size:12px;padding:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label.inl{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
select{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:5px 8px}
.btn{border:1px solid var(--blue);background:var(--blue);color:var(--sheet);border-radius:var(--r);padding:9px 16px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--blue)}
.btn.red{background:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.queue{font:12.5px var(--mono);color:var(--muted)}

/* The answer sheet */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);position:relative;min-width:0;overflow:hidden}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:44px;width:1px;background:var(--red);opacity:.45}
.sheet-in{padding:18px 18px 20px 62px;display:grid;gap:14px}
@media (max-width:520px){.sheet::before{left:22px}.sheet-in{padding-left:34px}}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.box{font:600 11px var(--mono);padding:2px 7px;border-radius:999px;background:var(--blue-soft);color:var(--blue)}
.qtitle{font-size:clamp(22px,3vw,28px);font-weight:700;line-height:1.2}
.qtext{font-size:16px;max-width:65ch}
.clue{font-family:var(--display);font-size:20px;line-height:1.4;max-width:60ch}
textarea,input[type=text]{width:100%;background:transparent;border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;color:var(--blue);
  font:15px/28px var(--body);background-image:repeating-linear-gradient(transparent 0 27px,var(--rule) 27px 28px);background-position:0 9px}
textarea{min-height:196px;resize:vertical}
input[type=text]{background-image:none;line-height:1.4}
.hint{font-size:12.5px;color:var(--muted)}
.marks{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.mark{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--rule);border-radius:var(--r);padding:9px 10px;cursor:pointer;background:var(--paper)}
.mark .tick{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center;font:700 16px var(--display);color:transparent}
.mark[aria-checked="true"]{border-color:var(--red);background:var(--red-soft)}
.mark[aria-checked="true"] .tick{border-color:var(--red);color:var(--red)}
.mark .auto{font:10.5px var(--mono);color:var(--muted);margin-left:6px}
.scoreline{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;border-top:1px dashed var(--rule);padding-top:12px}
.score{font:700 30px var(--display);color:var(--red);font-variant-numeric:tabular-nums}
.verdict{font-size:13px;color:var(--muted)}
.your{border-left:3px solid var(--blue);padding:6px 12px;color:var(--blue);white-space:pre-wrap;font-size:14px;max-height:220px;overflow:auto;background:var(--blue-soft);border-radius:0 var(--r) var(--r) 0}
.done{text-align:center;padding:40px 20px;display:grid;gap:10px;justify-items:center}
.done .big{font:700 48px var(--display);color:var(--red)}
.tip{border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:8px 12px;font-size:13.5px}
.reveal-title{font:700 22px var(--display)}
.kbd{font:11px var(--mono);border:1px solid var(--rule);border-radius:4px;padding:0 5px;color:var(--muted)}

/* Progress */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font:700 26px var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
table.prog{width:100%;border-collapse:collapse;font-size:13.5px}
table.prog th,table.prog td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--rule);vertical-align:middle}
table.prog th{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
table.prog td.num{font:12.5px var(--mono);text-align:right;white-space:nowrap}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--rule);min-width:120px}
.bar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.scroll{overflow-x:auto}

/* Browse */
.browse{display:grid;gap:12px}
details.case{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:10px 14px}
details.case summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
details.case summary b{font-family:var(--display);font-size:16px}
details.case ul{margin:8px 0 2px;padding-left:20px}
details.case p{margin:8px 0 0;color:var(--muted);font-size:13.5px}
.search{max-width:360px}
footer{color:var(--muted);font-size:12.5px;border-top:1px solid var(--rule);padding-top:12px}
@media (prefers-reduced-motion:no-preference){.sheet-in>*{animation:rise .25s ease both}@keyframes rise{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">9174 H2 History · Paper 1 &amp; Paper 2</div>
      <h1>H2 History Case Drill</h1>
      <p>Write down everything you remember about a case study, then mark yourself against your own notes. Cards you miss come back sooner.</p>
    </div>
    <div class="row">
      <span class="sync" id="sync">Progress saved in this browser</span>
      <nav class="tabs" role="tablist">
        <button role="tab" id="tab-drill" aria-selected="true" data-view="drill">Drill</button>
        <button role="tab" id="tab-progress" aria-selected="false" data-view="progress">Progress</button>
        <button role="tab" id="tab-browse" aria-selected="false" data-view="browse">Case bank</button>
      </nav>
    </div>
  </header>

  <section id="view-drill" class="grid">
    <aside class="panel" aria-label="Round settings">
      <div>
        <div class="eyebrow">Mode</div>
        <div class="seg" id="modes" style="margin-top:6px">
          <button data-mode="recall" aria-pressed="true">Recall<small>case → facts</small></button>
          <button data-mode="identify" aria-pressed="false">Name it<small>clue → case</small></button>
          <button data-mode="apply" aria-pressed="false">Apply<small>essay → cases</small></button>
        </div>
      </div>
      <div class="paperset" id="topicsets"></div>
      <div class="row">
        <label class="inl" for="roundsize">Cards per round
          <select id="roundsize"><option>5</option><option selected>10</option><option>15</option><option>20</option></select>
        </label>
      </div>
      <div class="queue" id="queueinfo"></div>
      <button class="btn" id="start">Start round</button>
    </aside>
    <main class="sheet" id="sheet" aria-live="polite"><div class="sheet-in" id="stage"></div></main>
  </section>

  <section id="view-progress" hidden>
    <div class="wrap">
      <div class="stats" id="stats"></div>
      <div class="panel">
        <div class="row" style="justify-content:space-between">
          <h2>By topic</h2>
          <div class="legend"><span><i style="background:var(--rule)"></i>New</span><span><i style="background:var(--red)"></i>Shaky (box 1–2)</span><span><i style="background:var(--warn)"></i>Learning (3–4)</span><span><i style="background:var(--ok)"></i>Secure (5)</span></div>
        </div>
        <div class="scroll"><table class="prog" id="progtable"></table></div>
        <div class="row"><button class="btn ghost" id="resetask">Reset all progress</button><span id="resetconfirm" hidden><button class="btn red" id="resetyes">Yes, clear everything</button> <button class="linkbtn" id="resetno">Cancel</button></span></div>
      </div>
    </div>
  </section>

  <section id="view-browse" hidden>
    <div class="wrap">
      <div class="row"><input type="text" id="search" class="search" placeholder="Search cases, dates, people…" aria-label="Search the case bank"><span class="hint" id="browsecount"></span></div>
      <div class="browse" id="browse"></div>
    </div>
  </section>

  <footer id="foot"></footer>
</div>

<script src="cases.js"></script>
<script src="essays.js"></script>
<script>
(function(){
const TOPICS = window.TOPICS, CASES = window.CASES, ESSAYS = window.ESSAYS;
const TOPIC = Object.fromEntries(TOPICS.map(t=>[t.key,t]));
const CASE = Object.fromEntries(CASES.map(c=>[c.id,c]));
const DAY = 864e5;
const INTERVAL = [0, 1, 2, 4, 8, 16]; // days until due again for box 0..5
const LS_KEY = "h2-case-drill-v1";
const $ = s => document.querySelector(s);
const el = (tag, attrs={}, ...kids) => { const n=document.createElement(tag); for(const [k,v] of Object.entries(attrs)){ if(k==="class") n.className=v; else if(k==="text") n.textContent=v; else if(k.startsWith("on")) n.addEventListener(k.slice(2),v); else n.setAttribute(k,v);} for(const k of kids.flat()) if(k!=null) n.append(k.nodeType?k:document.createTextNode(k)); return n; };

/* ---------- state ---------- */
let state = { v:1, cards:{}, settings:{ mode:"recall", topics:TOPICS.map(t=>t.key), size:10 } };
function lsLoad(){ try{ const s=JSON.parse(localStorage.getItem(LS_KEY)||"null"); if(s&&s.v===1) return s; }catch(e){} return null; }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
const fromLS = lsLoad(); if(fromLS) state = Object.assign(state, fromLS);
let dbDoc = null, saveTimer = null;
function save(){ lsSave(); if(!dbDoc) return; clearTimeout(saveTimer); saveTimer=setTimeout(()=>{ dbDoc.set({ state: JSON.stringify(state), at: Date.now() }).catch(()=>{}); }, 800); }
function merge(a,b){ // keep the most recently reviewed record per card
  const out = Object.assign({}, a.cards);
  for(const [k,v] of Object.entries(b.cards||{})) if(!out[k] || (v.last||0) > (out[k].last||0)) out[k]=v;
  return Object.assign({}, a, { cards: out });
}
(async function connect(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!db || !user) return;
    const id = await user.id(); if(!id) return;
    dbDoc = db.collection("data/users/"+id).doc("progress");
    const snap = await dbDoc.get();
    if(snap.exists){ try{ const remote = JSON.parse(snap.data().state); if(remote && remote.v===1){ state = merge(remote, state); state.settings = remote.settings || state.settings; } }catch(e){} }
    $("#sync").textContent = "Progress saved to your account";
    lsSave(); renderSettings(); renderQueueInfo(); if(currentView==="progress") renderProgress();
    if(!round) renderIdle();
  }catch(e){ dbDoc = null; }
})();

/* ---------- scheduling ---------- */
const recOf = id => state.cards[id] || { b:0, due:0, n:0, last:0 };
function itemsForMode(mode){
  const on = new Set(state.settings.topics);
  if(mode==="apply") return ESSAYS.filter(e=>on.has(e.t)).map(e=>"essay:"+e.id);
  return CASES.filter(c=>on.has(c.t)).map(c=>mode+":"+c.id);
}
function buildQueue(mode, size){
  const now = Date.now();
  const items = itemsForMode(mode).map(k=>({k, r:recOf(k)}));
  const due = items.filter(x=>x.r.n>0 && x.r.due<=now).sort((a,b)=>a.r.b-b.r.b || a.r.due-b.r.due);
  const fresh = shuffle(items.filter(x=>x.r.n===0));
  const later = items.filter(x=>x.r.n>0 && x.r.due>now).sort((a,b)=>a.r.due-b.r.due);
  return [...due, ...fresh, ...later].slice(0,size).map(x=>x.k);
}
function grade(key, frac){
  const r = Object.assign({}, recOf(key));
  if(frac>=0.8) r.b = Math.min(5, r.b+1);
  else if(frac>=0.5) r.b = Math.max(1, r.b);
  else r.b = 1;
  r.n++; r.last = Date.now(); r.score = Math.round(frac*100);
  r.due = frac<0.5 ? Date.now() : Date.now() + INTERVAL[r.b]*DAY;
  state.cards[key] = r; save();
  return r;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---------- auto-matching (a starting suggestion; you have the final say) ---------- */
const STOP = new Set("the and for with that this from into were was are has had have its their than then them they which while about after before over under between by of to in on at as an a or be is it not but also only more most each per vs via".split(" "));
const norm = s => s.toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g,"").replace(/[–—]/g,"-");
function tokens(s){ return norm(s).match(/[a-z]+|\d+(?:\.\d+)?/g)||[]; }
function keyTerms(point){
  const t = tokens(point).filter(w=>!STOP.has(w) && (w.length>=4 || /\d/.test(w)));
  return [...new Set(t)];
}
function autoMatch(point, answer){
  const ans = new Set(tokens(answer)); const ansText = norm(answer);
  const terms = keyTerms(point); if(!terms.length) return false;
  let hit = 0, numHit = false;
  for(const w of terms){ const ok = ans.has(w) || (w.length>=6 && ansText.includes(w.slice(0,6))); if(ok){ hit++; if(/\d/.test(w) && w.length>=2) numHit = true; } }
  return hit/terms.length >= 0.34 || (numHit && hit>=2);
}

/* ---------- settings panel ---------- */
function renderSettings(){
  document.querySelectorAll("#modes button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.mode===state.settings.mode)));
  $("#roundsize").value = String(state.settings.size);
  const box = $("#topicsets"); box.innerHTML = "";
  const on = new Set(state.settings.topics);
  for(const paper of ["P1","P2"]){
    const ts = TOPICS.filter(t=>t.paper===paper);
    const allOn = ts.every(t=>on.has(t.key));
    box.append(el("div",{class:"paperset"},
      el("div",{class:"ph"}, el("span",{class:"eyebrow",text: paper==="P1"?"Paper 1 · International order":"Paper 2 · Southeast Asia"}),
        el("button",{class:"linkbtn", text: allOn?"None":"All", onclick:()=>{ const s=new Set(state.settings.topics); ts.forEach(t=> allOn? s.delete(t.key): s.add(t.key)); state.settings.topics=[...s]; save(); renderSettings(); renderQueueInfo(); }})),
      el("div",{class:"chips"}, ts.map(t=>{
        const n = state.settings.mode==="apply" ? ESSAYS.filter(e=>e.t===t.key).length : CASES.filter(c=>c.t===t.key).length;
        return el("button",{class:"chip","aria-pressed":String(on.has(t.key)), title:t.theme+" · from "+t.src, onclick:()=>{ const s=new Set(state.settings.topics); s.has(t.key)?s.delete(t.key):s.add(t.key); state.settings.topics=[...s]; save(); renderSettings(); renderQueueInfo(); }}, t.name, el("span",{class:"n",text:String(n)}));
      }))
    ));
  }
}
function renderQueueInfo(){
  const items = itemsForMode(state.settings.mode), now=Date.now();
  const due = items.filter(k=>{const r=recOf(k); return r.n>0 && r.due<=now;}).length;
  const fresh = items.filter(k=>recOf(k).n===0).length;
  $("#queueinfo").textContent = items.length ? `${items.length} cards selected · ${due} due · ${fresh} not yet tried` : "Pick at least one topic.";
  $("#start").disabled = !items.length;
}
$("#modes").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; state.settings.mode=b.dataset.mode; save(); renderSettings(); renderQueueInfo(); if(!round) renderIdle(); });
$("#roundsize").addEventListener("change", e=>{ state.settings.size=+e.target.value; save(); });
$("#start").addEventListener("click", startRound);

/* ---------- round ---------- */
let round = null;
function startRound(){
  const q = buildQueue(state.settings.mode, state.settings.size);
  if(!q.length) return;
  round = { mode: state.settings.mode, queue:q, i:0, results:[], requeued:new Set() };
  showCard();
  if(window.matchMedia("(max-width:860px)").matches) $("#sheet").scrollIntoView({block:"start"});
}
function metaFor(c, key){
  const t = TOPIC[c.t], r = recOf(key);
  return el("div",{class:"meta"}, el("span",{class:"eyebrow",text:`${t.paper} · ${t.theme} · ${t.name}`}), el("span",{class:"box",text: r.n? `Box ${r.b}` : "New"}), el("span",{class:"queue",text:`${round.i+1} / ${round.queue.length}`}));
}
function showCard(){
  const stage = $("#stage"); stage.innerHTML = "";
  if(round.i >= round.queue.length) return showSummary();
  const key = round.queue[round.i], [mode,id] = key.split(":");
  if(mode==="recall") return recallCard(stage, key, CASE[id]);
  if(mode==="identify") return identifyCard(stage, key, CASE[id]);
  return applyCard(stage, key, ESSAYS.find(e=>e.id===id));
}
function next(key, frac){
  const r = grade(key, frac);
  round.results.push({key, frac});
  if(frac<0.5 && !round.requeued.has(key)){ round.requeued.add(key); round.queue.push(key); }
  round.i++; showCard();
  return r;
}

function recallCard(stage, key, c){
  const ta = el("textarea",{id:"answer", placeholder:"Write everything you can recall: dates, causes, figures, people, significance, historians…", "aria-label":"Your answer"});
  const reveal = el("button",{class:"btn", text:"Mark my answer"});
  const skip = el("button",{class:"btn ghost", text:"I don't know it"});
  stage.append(metaFor(c,key), el("h2",{class:"qtitle",text:c.title + " ("+c.when+")"}), el("div",{class:"qtext",text:c.q}), ta,
    el("div",{class:"row"}, reveal, skip, el("span",{class:"hint"}, el("span",{class:"kbd",text:"Ctrl"})," + ",el("span",{class:"kbd",text:"Enter"})," to mark")));
  ta.focus({preventScroll:true});
  const go = ()=>markRecall(stage, key, c, ta.value);
  reveal.onclick = go; skip.onclick = ()=>markRecall(stage, key, c, "");
  ta.addEventListener("keydown", e=>{ if(e.key==="Enter" && (e.ctrlKey||e.metaKey)) go(); });
}
function markRecall(stage, key, c, answer){
  stage.innerHTML = "";
  const got = c.pts.map(p=> answer.trim() ? autoMatch(p, answer) : false);
  const scoreEl = el("span",{class:"score"}), verdict = el("span",{class:"verdict"});
  const list = el("ul",{class:"marks"}, c.pts.map((p,i)=>{
    const li = el("li",{class:"mark", role:"checkbox", tabindex:"0", "aria-checked":String(got[i])},
      el("span",{class:"tick","aria-hidden":"true",text:"✓"}),
      el("span",{}, p, got[i]? el("span",{class:"auto",text:"matched"}):null));
    const toggle=()=>{ got[i]=!got[i]; li.setAttribute("aria-checked",String(got[i])); upd(); };
    li.addEventListener("click", toggle); li.addEventListener("keydown", e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); toggle(); }});
    return li;
  }));
  const upd = ()=>{ const k=got.filter(Boolean).length, f=k/c.pts.length; scoreEl.textContent = `${k}/${c.pts.length}`; verdict.textContent = f>=0.8? "Secure: moves up a box" : f>=0.5? "Partial: stays in its box, back tomorrow" : "Missed: back to box 1, repeats this round"; };
  upd();
  const nextBtn = el("button",{class:"btn", text:"Save mark and continue", onclick:()=>next(key, got.filter(Boolean).length/c.pts.length)});
  stage.append(metaFor(c,key), el("h2",{class:"qtitle",text:c.title}), el("div",{class:"qtext",text:c.q}),
    answer.trim()? el("div",{class:"your",text:answer}) : el("div",{class:"hint",text:"No answer written. Read the points below, then try it again next time."}),
    el("div",{class:"hint",text:"Tick each point your answer covered. Auto-matched ticks are a guess based on shared words; change them if they're wrong."}),
    list, el("div",{class:"scoreline"}, scoreEl, verdict, nextBtn));
  nextBtn.focus({preventScroll:true});
}

function identifyCard(stage, key, c){
  const inp = el("input",{type:"text", id:"guess", placeholder:"Name the case study", "aria-label":"Your answer", autocomplete:"off"});
  const reveal = el("button",{class:"btn", text:"Check"});
  stage.append(metaFor(c,key), el("div",{class:"eyebrow",text:"Which case study is this?"}), el("p",{class:"clue",text:c.clue}), inp,
    el("div",{class:"row"}, reveal, el("button",{class:"btn ghost",text:"Show me", onclick:()=>checkIdentify(stage,key,c,"")})));
  inp.focus({preventScroll:true});
  reveal.onclick = ()=>checkIdentify(stage,key,c,inp.value);
  inp.addEventListener("keydown", e=>{ if(e.key==="Enter") checkIdentify(stage,key,c,inp.value); });
}
function checkIdentify(stage, key, c, guess){
  const terms = keyTerms(c.title).filter(w=>!/^\d+$/.test(w));
  const g = new Set(tokens(guess)); const gt = norm(guess);
  const hit = terms.filter(w=>g.has(w) || (w.length>=5 && gt.includes(w.slice(0,5)))).length;
  const likely = guess.trim() && terms.length && hit/terms.length >= 0.5;
  stage.innerHTML = "";
  stage.append(metaFor(c,key), el("p",{class:"clue",text:c.clue}),
    guess.trim()? el("div",{class:"your",text:guess}) : null,
    el("div",{}, el("div",{class:"eyebrow",text:"Answer"}), el("div",{class:"reveal-title",text:c.title+" ("+c.when+")"})),
    el("div",{class:"hint",text: likely? "Looks like a match." : guess.trim()? "Doesn't look like a match. Mark it yourself if you used a different name." : ""}),
    el("div",{class:"scoreline"},
      el("button",{class:"btn", text:"I got it", onclick:()=>next(key,1)}),
      el("button",{class:"btn ghost", text:"I missed it", onclick:()=>next(key,0)})),
    el("details",{}, el("summary",{class:"hint",text:"Revise the key points"}), el("ul",{}, c.pts.map(p=>el("li",{text:p})))));
}

function applyCard(stage, key, e){
  const t = TOPIC[e.t], r = recOf(key);
  const ta = el("textarea",{id:"plan", placeholder:"Plan your answer: which case studies would you use, for which side of the argument, and what evidence from each?", "aria-label":"Your essay plan", style:"min-height:168px"});
  stage.append(el("div",{class:"meta"}, el("span",{class:"eyebrow",text:`${t.paper} · ${t.theme} · Essay / SBCS`}), el("span",{class:"box",text:r.n?`Box ${r.b}`:"New"}), el("span",{class:"queue",text:`${round.i+1} / ${round.queue.length}`})),
    el("h2",{class:"qtitle",text:e.q}), ta,
    el("div",{class:"row"}, el("button",{class:"btn",text:"Compare with my notes", onclick:()=>markApply(stage,key,e,ta.value)})));
  ta.focus({preventScroll:true});
}
function markApply(stage, key, e, plan){
  const t = TOPIC[e.t];
  const got = e.use.map(id=>{ const c=CASE[id]; const terms=keyTerms(c.title).filter(w=>!/^\d+$/.test(w)); const g=new Set(tokens(plan)), gt=norm(plan); const h=terms.filter(w=>g.has(w)||(w.length>=5&&gt.includes(w.slice(0,5)))).length; return plan.trim() && terms.length && h/terms.length>=0.5; });
  stage.innerHTML = "";
  const scoreEl = el("span",{class:"score"}), verdict = el("span",{class:"verdict"});
  const upd = ()=>{ const k=got.filter(Boolean).length; scoreEl.textContent=`${k}/${e.use.length}`; const f=k/e.use.length; verdict.textContent = f>=0.8? "Strong coverage" : f>=0.5? "Partial coverage" : "Thin: revisit these cases"; };
  const list = el("ul",{class:"marks"}, e.use.map((id,i)=>{ const c=CASE[id];
    const li = el("li",{class:"mark",role:"checkbox",tabindex:"0","aria-checked":String(!!got[i])}, el("span",{class:"tick","aria-hidden":"true",text:"✓"}),
      el("span",{}, el("b",{text:c.title+" "}), el("span",{class:"hint",text:"("+c.when+") · "+TOPIC[c.t].name}), el("div",{class:"hint",text:c.pts[0]})));
    const tog=()=>{ got[i]=!got[i]; li.setAttribute("aria-checked",String(got[i])); upd(); };
    li.addEventListener("click",tog); li.addEventListener("keydown",ev=>{ if(ev.key===" "||ev.key==="Enter"){ ev.preventDefault(); tog(); }});
    return li; }));
  upd();
  stage.append(el("div",{class:"meta"}, el("span",{class:"eyebrow",text:`${t.paper} · ${t.theme} · Essay / SBCS`})), el("h2",{class:"qtitle",text:e.q}),
    plan.trim()? el("div",{class:"your",text:plan}) : null,
    el("div",{class:"tip"}, el("b",{text:"From your notes: "}), e.tip),
    el("div",{class:"hint",text:"Case studies your notes point to. Tick the ones your plan used."}), list,
    el("div",{class:"scoreline"}, scoreEl, verdict, el("button",{class:"btn",text:"Save and continue", onclick:()=>next(key, got.filter(Boolean).length/e.use.length)})));
}

function showSummary(){
  const stage = $("#stage"); stage.innerHTML = "";
  const firsts = []; const seen = new Set();
  for(const r of round.results){ if(!seen.has(r.key)){ seen.add(r.key); firsts.push(r); } }
  const avg = firsts.length ? Math.round(100*firsts.reduce((s,r)=>s+r.frac,0)/firsts.length) : 0;
  const weak = firsts.filter(r=>r.frac<0.5).map(r=>{ const [m,id]=r.key.split(":"); return m==="essay"? ESSAYS.find(e=>e.id===id).q : CASE[id].title; });
  stage.append(el("div",{class:"done"},
    el("div",{class:"eyebrow",text:"Round complete"}), el("div",{class:"big",text:avg+"%"}),
    el("div",{class:"hint",text:`Average first-attempt mark across ${firsts.length} cards.`}),
    weak.length? el("div",{}, el("div",{class:"eyebrow",text:"Revise these first"}), el("ul",{style:"text-align:left"}, weak.map(w=>el("li",{text:w})))) : el("div",{class:"hint",text:"Nothing below half marks this round."}),
    el("div",{class:"row",style:"justify-content:center"}, el("button",{class:"btn",text:"Next round", onclick:startRound}), el("button",{class:"btn ghost",text:"See progress", onclick:()=>setView("progress")}))));
  round = null; renderQueueInfo();
}
function renderIdle(){

  const desc = { recall:"You get a case study and a question. Write what you remember, then tick off the key points from your notes that you covered.",
    identify:"You get a description of a case study without its name. Say which case it is.",
    apply:"You get an essay or source-based question. Plan which case studies you'd use, then compare with the cases your notes point to." }[m];
  stage.append(el("div",{class:"eyebrow",text:"How a round works"}), el("p",{class:"qtext",text:desc}),
    el("div",{class:"eyebrow",text:"Example card"}),
    m==="identify" ? el("p",{class:"clue",text:ex.clue}) :
    m==="apply" ? el("h2",{class:"qtitle",text:ESSAYS[0].q}) :
    el("div",{}, el("h2",{class:"qtitle",text:ex.title+" ("+ex.when+")"}), el("div",{class:"qtext",text:ex.q})),
    el("div",{class:"hint",text:"Choose your topics on the left and press Start round. Cards you score under half on come back again before the round ends."}));
}

/* ---------- progress ---------- */
function renderProgress(){
  const now = Date.now();
  const keys = CASES.map(c=>"recall:"+c.id);
  const tried = keys.filter(k=>recOf(k).n>0), secure = keys.filter(k=>recOf(k).b>=5), due = keys.filter(k=>{const r=recOf(k); return r.n>0&&r.due<=now;});
  const all = Object.entries(state.cards); const reviews = all.reduce((s,[,r])=>s+r.n,0);
  $("#stats").innerHTML = "";
  [[tried.length+" / "+keys.length,"Case studies attempted"],[secure.length,"Secure (box 5)"],[due.length,"Due for review now"],[reviews,"Cards marked, all modes"]]
    .forEach(([b,s])=>$("#stats").append(el("div",{class:"stat"}, el("b",{text:String(b)}), el("span",{text:s}))));
  const tb = $("#progtable"); tb.innerHTML = "";
  tb.append(el("tr",{}, el("th",{text:"Topic"}), el("th",{text:"Recall boxes"}), el("th",{class:"num",text:"Avg last mark"}), el("th",{class:"num",text:"Due"}), el("th",{text:""})));
  for(const t of TOPICS){
    const ks = CASES.filter(c=>c.t===t.key).map(c=>"recall:"+c.id);
    const rs = ks.map(recOf);
    const seg = [rs.filter(r=>r.n===0).length, rs.filter(r=>r.n>0&&r.b<=2).length, rs.filter(r=>r.b>=3&&r.b<=4).length, rs.filter(r=>r.b>=5).length];
    const marked = rs.filter(r=>r.n>0); const avg = marked.length? Math.round(marked.reduce((s,r)=>s+(r.score||0),0)/marked.length)+"%" : "–";
    const dueN = rs.filter(r=>r.n>0&&r.due<=now).length;
    const bar = el("div",{class:"bar", title:`${seg[0]} new, ${seg[1]} shaky, ${seg[2]} learning, ${seg[3]} secure`},
      ...[["var(--rule)",seg[0]],["var(--red)",seg[1]],["var(--warn)",seg[2]],["var(--ok)",seg[3]]].map(([c,n])=>el("i",{style:`width:${100*n/ks.length}%;background:${c}`})));
    tb.append(el("tr",{}, el("td",{}, el("div",{text:t.name}), el("div",{class:"hint",text:t.paper+" · "+t.theme})), el("td",{},bar), el("td",{class:"num",text:avg}), el("td",{class:"num",text:String(dueN)}),
      el("td",{}, el("button",{class:"linkbtn",text:"Drill this", onclick:()=>{ state.settings.topics=[t.key]; state.settings.mode="recall"; save(); renderSettings(); renderQueueInfo(); setView("drill"); startRound(); }}))));
  }
}
$("#resetask").onclick = ()=>{ $("#resetconfirm").hidden=false; };
$("#resetno").onclick = ()=>{ $("#resetconfirm").hidden=true; };
$("#resetyes").onclick = ()=>{ state.cards={}; save(); $("#resetconfirm").hidden=true; renderProgress(); renderQueueInfo(); };

/* ---------- browse ---------- */
function renderBrowse(){
  const q = norm($("#search").value.trim()); const box=$("#browse"); box.innerHTML="";
  let n=0;
  for(const t of TOPICS){
    const cs = CASES.filter(c=>c.t===t.key && (!q || norm([c.title,c.when,c.q,...c.pts].join(" ")).includes(q)));
    if(!cs.length) continue; n+=cs.length;
    box.append(el("div",{class:"eyebrow",style:"margin-top:6px",text:`${t.paper} · ${t.theme} · ${t.name} — from ${t.src}`}));
    cs.forEach(c=>{ const r=recOf("recall:"+c.id);
      box.append(el("details",{class:"case"}, el("summary",{}, el("b",{text:c.title}), el("span",{class:"hint",text:c.when}), el("span",{class:"box",text:r.n?`Box ${r.b}`:"New"})),
        el("p",{text:c.q}), el("ul",{}, c.pts.map(p=>el("li",{text:p}))))); });
  }
  $("#browsecount").textContent = `${n} case studies`;
}
$("#search").addEventListener("input", renderBrowse);

/* ---------- views ---------- */
let currentView = "drill";
function setView(v){

  for(const k of ["drill","progress","browse"]) $("#view-"+k).hidden = k!==v;
  if(v==="progress") renderProgress(); if(v==="browse") renderBrowse();
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.view)));

$("#foot").textContent = `${CASES.length} case studies and ${ESSAYS.length} essay prompts, written from the study notes in your History Drive folder (Paper 1 Y5–Y6, Paper 2 Y6). Nothing outside those notes was added.`;

})();
